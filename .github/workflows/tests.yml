name: tests

on:
  push:
  pull_request:

jobs:
  godot-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
      - name: Import project
        run: ./godot --headless --import || true
      - name: Parse-check all scripts
        run: |
          fail=0
          for f in $(find src tests tools -name "*.gd"); do
            if ./godot --headless --check-only -s "res://$f" 2>&1 | grep -q "Parse Error"; then echo "::error file=$f::parse error"; fail=1; fi
          done
          exit $fail
      - name: Unit & data tests
        run: ./godot --headless -- --unit
      - name: Gameplay smoke test (first-build checklist)
        run: ./godot --headless -- --smoke
      - name: Progression systems test (quests, bosses, mount, puzzles, shop, events, regions)
        run: ./godot --headless -- --systems
